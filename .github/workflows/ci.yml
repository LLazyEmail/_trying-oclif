name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: npm install → build → test → help
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exact workflow (Node >= 22 required by @oclif/core v5)
      - name: npm install
        run: npm install

      - name: npm run build
        run: npm run build

      - name: npm test
        run: npm test

      - name: ./bin/run.js --help
        run: |
          chmod +x ./bin/run.js ./bin/dev.js
          ./bin/run.js --help
