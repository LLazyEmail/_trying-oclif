version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      oclif:
        patterns:
          - "@oclif/*"
          - "oclif"
      typescript-eslint:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "prettier"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
